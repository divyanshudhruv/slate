name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: slate

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - name: Build x64
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build arm64
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
            $tag = "v$version"
          }
          $map = [ordered]@{
            "x86_64-pc-windows-msvc" = "x64"
            "aarch64-pc-windows-msvc" = "arm64"
          }
          $lines = foreach ($target in $map.Keys) {
            $name = "$env:BIN-$tag-$($map[$target])"
            Copy-Item "target/$target/release/$env:BIN.exe" "$name.exe"
            "$((Get-FileHash "$name.exe" -Algorithm SHA256).Hash.ToLower())  $name.exe"
          }
          $lines | Out-File -Encoding ascii SHA256SUMS
          "asset_name=$env:BIN-$tag-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "asset_name_arm64=$env:BIN-$tag-arm64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # A build that Windows Defender flags is not worth publishing. Only a real
      # detection (exit code 2) fails the job; a runner with no Defender, or with
      # the service stopped, is reported and skipped.
      - name: Scan with Defender
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) {
            Write-Host "MpCmdRun.exe not found; skipping the Defender smoke test"
            exit 0
          }
          $flagged = @()
          foreach ($name in @("${{ env.asset_name }}.exe", "${{ env.asset_name_arm64 }}.exe")) {
            $file = (Get-Item $name).FullName
            & $mp -Scan -ScanType 3 -File $file -DisableRemediation -Timeout 10
            if ($LASTEXITCODE -eq 2) {
              $flagged += $name
            } else {
              Write-Host "Defender found no threat in $name (exit $LASTEXITCODE)"
            }
          }
          if ($flagged.Count -gt 0) {
            Write-Host "Defender flagged: $($flagged -join ', ')"
            exit 1
          }

      - name: Upload to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "${{ env.asset_name }}.exe" "${{ env.asset_name_arm64 }}.exe" "SHA256SUMS" --clobber

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.asset_name }}
          path: |
            ${{ env.asset_name }}.exe
            ${{ env.asset_name_arm64 }}.exe
            SHA256SUMS

  # Rewrites the release body after the assets land. Sections, numbered
  # entries, hashes, and contributor handles are generated from the commits
  # between this tag and the previous one. See
  # .github/scripts/render-release-notes.mjs.
  release-notes:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Render release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/render-release-notes.mjs "${{ github.event.release.tag_name }}"
